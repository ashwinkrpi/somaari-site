name: Refresh

# Hourly: rebuild docs.somaari.in when a manifest guide or somaari-common's theme/ or apps/ changed on
# GitHub since the last successful deploy (scripts/refresh.sh). Replaced the Pi's hourly cron job on
# 2026-11-26. The last deployed SHAs (.state/last-shas.json) are kept in the Actions cache; if the cache
# is ever evicted, the next run sees everything as changed and deploys once.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Deploy even if nothing changed
        type: boolean
        default: false

permissions:
  contents: read
  issues: write # scripts/notify.sh opens or closes the refresh-failed issue

concurrency:
  group: deploy # shared with deploy.yml, so a refresh never runs at the same time as a push deploy
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: 1
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      FORCE: ${{ inputs.force && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Restore the last deployed SHAs
        uses: actions/cache/restore@v4
        with:
          path: .state/last-shas.json
          key: refresh-shas-${{ github.run_id }}
          restore-keys: refresh-shas-
      - name: Refresh
        run: |
          export CHROMIUM="$(command -v google-chrome || command -v chromium)"
          status=0
          bash scripts/refresh.sh || status=$?
          cat .state/refresh.log
          exit "$status"
      - name: Save the deployed SHAs
        if: always() && hashFiles('.state/last-shas.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .state/last-shas.json
          key: refresh-shas-${{ github.run_id }}
